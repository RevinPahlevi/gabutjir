<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoBooth — FotoKita</title>
    <meta name="description" content="PhotoBooth online dengan berbagai frame cantik. Foto langsung dari browser!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep:    #0a0a0f;
            --bg-card:    rgba(20,20,32,0.75);
            --bg-glass:   rgba(255,255,255,0.03);
            --border:     rgba(255,255,255,0.07);
            --rose:       #f43f5e;
            --rose-light: #fb7185;
            --rose-glow:  rgba(244,63,94,0.3);
            --pink:       #ec4899;
            --pink-light: #f9a8d4;
            --gold:       #fbbf24;
            --success:    #34d399;
            --text-1:     #faf5ff;
            --text-2:     #c4b5d0;
            --text-3:     #6b5f7d;
            --radius:     16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family:'Outfit',sans-serif; background:var(--bg-deep); color:var(--text-1); min-height:100vh; overflow:hidden; }

        .ambient { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
        .ambient-orb { position:absolute; border-radius:50%; filter:blur(80px); animation:orbFloat 12s ease-in-out infinite; }
        .ao1{width:500px;height:500px;background:rgba(244,63,94,0.06);top:-15%;left:-10%;}
        .ao2{width:400px;height:400px;background:rgba(236,72,153,0.05);bottom:-20%;right:-5%;animation-delay:-4s;animation-duration:15s;}
        .ao3{width:300px;height:300px;background:rgba(251,191,36,0.03);top:40%;left:40%;animation-delay:-7s;animation-duration:18s;}
        @keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(30px,-20px) scale(1.1);}66%{transform:translate(-20px,15px) scale(0.95);}}

        #app { display:flex; flex-direction:column; height:100vh; position:relative; z-index:1; }

        /* Top bar */
        .top-bar {
            display:flex; align-items:center; gap:12px; padding:10px 20px;
            border-bottom:1px solid var(--border);
            background:rgba(10,10,15,0.85); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            flex-shrink:0; z-index:10;
        }
        .back-btn {
            display:flex; align-items:center; gap:6px; padding:6px 14px;
            background:var(--bg-glass); border:1px solid var(--border); border-radius:10px;
            color:var(--text-2); font-family:'Outfit',sans-serif; font-size:0.8rem; font-weight:500;
            cursor:pointer; text-decoration:none; transition:all .25s;
        }
        .back-btn:hover { background:rgba(255,255,255,0.06); color:var(--text-1); border-color:rgba(255,255,255,0.12); }
        .top-title {
            font-family:'Dancing Script',cursive; font-size:1.5rem; font-weight:700;
            background:linear-gradient(135deg,var(--rose-light),var(--pink-light),var(--gold));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .top-sub { font-size:0.72rem; color:var(--text-3); }
        .top-right { margin-left:auto; display:flex; align-items:center; gap:6px; }
        .shot-dot {
            width:9px; height:9px; border-radius:50%;
            background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15);
            transition:all .3s;
        }
        .shot-dot.taken { background:var(--rose); border-color:var(--rose); box-shadow:0 0 6px var(--rose); }
        .shot-dot.active { background:var(--gold); border-color:var(--gold); animation:dotBlink .7s infinite; }
        @keyframes dotBlink{0%,100%{opacity:1}50%{opacity:.3}}

        /* Main */
        .main-content { flex:1; display:flex; overflow:hidden; }

        /* Camera area */
        .cam-area {
            flex:1; display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            padding:14px; gap:12px;
        }
        .cam-wrapper {
            position:relative; width:100%; max-width:720px; aspect-ratio:4/3;
            border-radius:22px; overflow:hidden;
            box-shadow:0 0 0 1px rgba(244,63,94,0.15), 0 24px 70px -20px rgba(244,63,94,0.12);
        }
        #preview-canvas { width:100%; height:100%; display:block; }

        .countdown-overlay {
            position:absolute; inset:0; display:flex;
            align-items:center; justify-content:center;
            background:rgba(10,10,15,0.5); backdrop-filter:blur(4px);
            opacity:0; pointer-events:none; transition:opacity .25s;
        }
        .countdown-overlay.visible { opacity:1; }
        .countdown-num {
            font-size:min(18vw,9rem); font-weight:900; line-height:1;
            background:linear-gradient(135deg,var(--rose-light),var(--pink-light),var(--gold));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            filter:drop-shadow(0 0 40px rgba(244,63,94,0.6));
        }
        .countdown-num.pop { animation:countPop .9s cubic-bezier(.16,1,.3,1); }
        @keyframes countPop{0%{transform:scale(1.8);opacity:0;}15%{transform:scale(1);opacity:1;}85%{transform:scale(1);opacity:1;}100%{transform:scale(.7);opacity:0;}}

        .flash-overlay { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
        .flash-overlay.flash { animation:flashAnim .5s ease-out; }
        @keyframes flashAnim{0%{opacity:.95}100%{opacity:0}}

        .done-badge {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            background:rgba(10,10,15,0.75); backdrop-filter:blur(16px);
            border:1px solid rgba(52,211,153,0.4); border-radius:14px;
            padding:12px 28px; font-size:.9rem; font-weight:700; color:#34d399;
            display:flex; align-items:center; gap:10px; white-space:nowrap;
            opacity:0; pointer-events:none; transition:opacity .4s;
            box-shadow:0 0 30px -10px rgba(52,211,153,.3);
        }
        .done-badge.visible { opacity:1; }

        .no-cam {
            position:absolute; inset:0; display:none;
            flex-direction:column; align-items:center; justify-content:center;
            gap:14px; color:var(--text-3);
        }
        .no-cam .nc-icon { font-size:3rem; }
        .no-cam p { font-size:.85rem; }
        .no-cam button {
            padding:9px 22px; border:none; border-radius:10px;
            background:var(--rose); color:#fff;
            font-family:inherit; font-weight:600; font-size:.85rem; cursor:pointer;
        }

        /* Strip row */
        .strip-row { display:flex; gap:8px; width:100%; max-width:720px; }
        .strip-slot {
            flex:1; aspect-ratio:4/3;
            background:rgba(0,0,0,.35);
            border:1px dashed rgba(255,255,255,.08); border-radius:10px;
            overflow:hidden; display:flex; align-items:center; justify-content:center;
            position:relative; font-size:.65rem; color:var(--text-3); transition:border-color .3s;
        }
        .strip-slot.taken { border:1px solid rgba(244,63,94,.25); }
        .strip-slot img { width:100%; height:100%; object-fit:cover; display:block; }
        .snum {
            position:absolute; top:4px; left:4px;
            font-size:.58rem; font-weight:700; color:rgba(255,255,255,.5);
            background:rgba(0,0,0,.55); border-radius:4px; padding:1px 5px;
        }
        .sdel {
            position:absolute; top:4px; right:4px;
            width:18px; height:18px; border-radius:50%;
            background:rgba(244,63,94,.85); border:none; color:#fff;
            font-size:.65rem; cursor:pointer; display:none;
            align-items:center; justify-content:center; line-height:1;
        }
        .strip-slot.taken:hover .sdel { display:flex; }

        /* Side panel */
        .side-panel {
            width:290px; min-width:290px; display:flex; flex-direction:column;
            gap:10px; padding:14px 14px 14px 0; overflow-y:auto;
        }
        .side-panel::-webkit-scrollbar{width:0;}
        .glass-card {
            background:var(--bg-card); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            border:1px solid var(--border); border-radius:var(--radius); padding:14px;
        }
        .card-label {
            font-size:.63rem; font-weight:600; color:var(--text-3);
            text-transform:uppercase; letter-spacing:1.2px;
            margin-bottom:12px; display:flex; align-items:center; gap:6px;
        }
        .card-label::before { content:''; width:14px; height:1.5px; background:linear-gradient(90deg,var(--rose),transparent); border-radius:2px; }

        /* Frame grid */
        .frame-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .frame-thumb {
            position:relative; aspect-ratio:4/3; border-radius:9px; overflow:hidden;
            cursor:pointer; border:2px solid transparent; transition:all .22s;
        }
        .frame-thumb:hover { border-color:rgba(244,63,94,.35); transform:scale(1.04); }
        .frame-thumb.active { border-color:var(--rose); box-shadow:0 0 14px -4px var(--rose-glow); }
        .frame-thumb canvas { width:100%; height:100%; display:block; }
        .ftlabel {
            position:absolute; bottom:0; left:0; right:0;
            padding:3px 4px; background:linear-gradient(transparent,rgba(10,10,15,.85));
            font-size:.52rem; font-weight:600; color:var(--text-2); text-align:center;
        }
        .frame-thumb.active .ftlabel { color:var(--rose-light); }

        /* Buttons */
        .capture-btn {
            width:100%; padding:13px;
            background:linear-gradient(135deg,var(--rose),var(--pink));
            border:none; border-radius:14px; color:#fff;
            font-family:'Outfit',sans-serif; font-size:.95rem; font-weight:700;
            cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
            transition:all .25s; box-shadow:0 8px 24px -8px var(--rose-glow); letter-spacing:.3px;
        }
        .capture-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 14px 32px -8px var(--rose-glow); }
        .capture-btn:active:not(:disabled) { transform:translateY(0); }
        .capture-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }

        .action-row { display:flex; gap:8px; margin-top:10px; }
        .btn-ghost {
            flex:1; padding:9px 8px;
            background:var(--bg-glass); border:1px solid var(--border); border-radius:11px;
            color:var(--text-2); font-family:'Outfit',sans-serif; font-size:.78rem; font-weight:500;
            cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px; transition:all .22s;
        }
        .btn-ghost:hover:not(:disabled) { background:rgba(255,255,255,.06); color:var(--text-1); }
        .btn-ghost:disabled { opacity:.35; cursor:not-allowed; }
        .btn-dl {
            flex:1; padding:9px 8px;
            background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(52,211,153,.08));
            border:1px solid rgba(52,211,153,.3); border-radius:11px; color:#34d399;
            font-family:'Outfit',sans-serif; font-size:.78rem; font-weight:600;
            cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px; transition:all .22s;
        }
        .btn-dl:hover:not(:disabled) { background:linear-gradient(135deg,rgba(52,211,153,.28),rgba(52,211,153,.14)); box-shadow:0 0 18px -8px rgba(52,211,153,.35); }
        .btn-dl:disabled { opacity:.35; cursor:not-allowed; }
        .info-txt { font-size:.68rem; color:var(--text-3); text-align:center; margin-top:8px; line-height:1.55; }

        @media(max-width:820px){
            .main-content{flex-direction:column;}
            .side-panel{width:100%;min-width:0;flex-direction:row;flex-wrap:wrap;padding:8px;gap:8px;max-height:210px;overflow-y:auto;}
            .side-panel .glass-card{flex:1;min-width:180px;}
            .cam-area{padding:8px;gap:8px;}
        }
    </style>
</head>
<body>
<div class="ambient">
    <div class="ambient-orb ao1"></div>
    <div class="ambient-orb ao2"></div>
    <div class="ambient-orb ao3"></div>
</div>

<div id="app">
    <div class="top-bar">
        <a href="index.html" class="back-btn">&#8592; Kembali</a>
        <div style="display:flex;align-items:baseline;gap:8px">
            <span class="top-title">PhotoBooth</span>
            <span class="top-sub">FotoKita &#128247;</span>
        </div>
        <div class="top-right" id="dot-row">
            <span style="font-size:.7rem;color:var(--text-3)">&#128247;</span>
            <div class="shot-dot" data-i="0"></div>
            <div class="shot-dot" data-i="1"></div>
            <div class="shot-dot" data-i="2"></div>
            <div class="shot-dot" data-i="3"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="cam-area">
            <div class="cam-wrapper" id="cam-wrapper">
                <canvas id="preview-canvas"></canvas>
                <div class="countdown-overlay" id="co">
                    <div class="countdown-num" id="cn">3</div>
                </div>
                <div class="flash-overlay" id="fl"></div>
                <div class="done-badge" id="done-badge">&#10024; Strip selesai! Unduh atau ulangi.</div>
                <div class="no-cam" id="nc">
                    <div class="nc-icon">&#128247;</div>
                    <p>Kamera tidak dapat diakses</p>
                    <button onclick="location.reload()">&#128260; Coba Lagi</button>
                </div>
            </div>
            <div class="strip-row" id="strip-row"></div>
        </div>

        <div class="side-panel">
            <div class="glass-card">
                <div class="card-label">Pilih Frame</div>
                <div class="frame-grid" id="frame-grid"></div>
            </div>
            <div class="glass-card">
                <div class="card-label">Kontrol</div>
                <button class="capture-btn" id="capBtn" disabled>
                    &#128247; Mulai Strip 4 Foto
                </button>
                <div class="info-txt">Countdown 3 detik per foto<br>Mirror &amp; frame otomatis</div>
                <div class="action-row">
                    <button class="btn-ghost" id="resetBtn" disabled>&#128260; Ulangi</button>
                    <button class="btn-dl"    id="dlBtn"    disabled>&#11015;&#65039; Unduh Strip</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const pc   = document.getElementById('preview-canvas');
const pctx = pc.getContext('2d');
const co   = document.getElementById('co');
const cn   = document.getElementById('cn');
const fl   = document.getElementById('fl');
const done = document.getElementById('done-badge');
const capBtn   = document.getElementById('capBtn');
const resetBtn = document.getElementById('resetBtn');
const dlBtn    = document.getElementById('dlBtn');
const fg   = document.getElementById('frame-grid');
const sr   = document.getElementById('strip-row');
const ncEl = document.getElementById('nc');
const dots = document.querySelectorAll('.shot-dot[data-i]');

const vid = document.createElement('video');
vid.autoplay = vid.playsInline = vid.muted = true;

let selFrame = 0, photos = [], shooting = false, ready = false;
const MAX = 4;

// ── Frames ──────────────────────────────────────────────
const FRAMES = [
{
  name:'Sakura',
  draw(ctx,w,h){
    ctx.strokeStyle='rgba(244,63,94,.8)'; ctx.lineWidth=Math.max(3,w*.005);
    const lw=ctx.lineWidth; ctx.strokeRect(lw,lw,w-lw*2,h-lw*2);
    ctx.strokeStyle='rgba(244,63,94,.2)'; ctx.lineWidth=1;
    const p2=lw+8; ctx.strokeRect(p2,p2,w-p2*2,h-p2*2);
    const sz=Math.min(w,h)*.12; ctx.font=sz+'px serif';
    ctx.textAlign='left'; ctx.textBaseline='top';    ctx.fillText('\uD83C\uDF38',sz*.05,sz*.05);
    ctx.textAlign='right'; ctx.textBaseline='top';   ctx.fillText('\uD83C\uDF38',w-sz*.05,sz*.05);
    ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillText('\uD83C\uDF38',sz*.05,h-sz*.05);
    ctx.textAlign='right'; ctx.textBaseline='bottom';ctx.fillText('\uD83C\uDF38',w-sz*.05,h-sz*.05);
    ctx.font=(sz*.65)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText('\uD83D\uDC95',w/2,sz*.1);
  }
},
{
  name:'Film Strip',
  draw(ctx,w,h){
    const bw=Math.round(w*.09),pW=Math.round(bw*.55),pH=Math.round(pW*.65);
    const px1=Math.round((bw-pW)/2),px2=w-bw+px1,gap=pH*1.6;
    ctx.fillStyle='#141414'; ctx.fillRect(0,0,bw,h); ctx.fillRect(w-bw,0,bw,h);
    ctx.fillStyle='#fff';
    for(let y=gap*.6;y<h-pH;y+=gap+pH){
      [px1,px2].forEach(px=>{
        ctx.beginPath();
        if(ctx.roundRect)ctx.roundRect(px,y,pW,pH,2); else ctx.rect(px,y,pW,pH);
        ctx.fill();
      });
    }
    ctx.save(); ctx.translate(bw/2,h/2); ctx.rotate(-Math.PI/2);
    ctx.fillStyle='rgba(255,255,255,.22)'; ctx.font='bold '+Math.max(8,bw*.22)+'px Outfit,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('FOTOKITA',0,0); ctx.restore();
  }
},
{
  name:'Fairy \u2728',
  draw(ctx,w,h){
    const g=ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'rgba(168,85,247,.85)'); g.addColorStop(.4,'rgba(244,63,94,.85)');
    g.addColorStop(.7,'rgba(251,191,36,.85)'); g.addColorStop(1,'rgba(168,85,247,.85)');
    ctx.strokeStyle=g; ctx.lineWidth=5; ctx.strokeRect(4,4,w-8,h-8);
    ctx.strokeStyle='rgba(251,191,36,.25)'; ctx.lineWidth=1; ctx.strokeRect(13,13,w-26,h-26);
    const sz=Math.min(w,h)*.11; ctx.font=sz+'px serif';
    [['left','top',sz*.1,sz*.1],['right','top',w-sz*.1,sz*.1],
     ['left','bottom',sz*.1,h-sz*.1],['right','bottom',w-sz*.1,h-sz*.1]
    ].forEach(([a,b,x,y])=>{ctx.textAlign=a;ctx.textBaseline=b;ctx.fillText('\u2728',x,y);});
    ctx.font=(sz*.58)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    [[w/2,sz*.55],[w/2,h-sz*.55],[sz*.55,h/2],[w-sz*.55,h/2]].forEach(([x,y])=>ctx.fillText('\u2B50',x,y));
  }
},
{
  name:'Neon Glow',
  draw(ctx,w,h){
    ctx.shadowColor='rgba(6,182,212,.85)'; ctx.shadowBlur=22;
    ctx.strokeStyle='rgba(6,182,212,.9)'; ctx.lineWidth=2; ctx.strokeRect(7,7,w-14,h-14);
    ctx.shadowColor='rgba(168,85,247,.7)'; ctx.shadowBlur=14;
    ctx.strokeStyle='rgba(168,85,247,.75)'; ctx.lineWidth=1.5; ctx.strokeRect(14,14,w-28,h-28);
    ctx.shadowBlur=0;
    const cs=Math.min(w,h)*.1;
    ctx.strokeStyle='#00f7ff'; ctx.lineWidth=3;
    ctx.shadowColor='rgba(0,247,255,.8)'; ctx.shadowBlur=14;
    [[12,12,1,1],[w-12,12,-1,1],[12,h-12,1,-1],[w-12,h-12,-1,-1]].forEach(([x,y,dx,dy])=>{
      ctx.beginPath(); ctx.moveTo(x+dx*cs,y); ctx.lineTo(x,y); ctx.lineTo(x,y+dy*cs); ctx.stroke();
    });
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(0,247,255,.012)';
    for(let y=0;y<h;y+=4)ctx.fillRect(0,y,w,2);
  }
},
{
  name:'Polaroid',
  draw(ctx,w,h){
    const bT=Math.round(h*.04),bS=Math.round(w*.05),bB=Math.round(h*.18);
    ctx.fillStyle='#f5f5f5';
    ctx.fillRect(0,0,w,bT); ctx.fillRect(0,h-bB,w,bB);
    ctx.fillRect(0,bT,bS,h-bT-bB); ctx.fillRect(w-bS,bT,bS,h-bT-bB);
    ctx.fillStyle='rgba(0,0,0,.06)'; ctx.fillRect(bS,h-bB,w-bS*2,1.5);
    ctx.fillStyle='#999'; ctx.font='italic '+Math.round(h*.05)+'px Dancing Script,Georgia,serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('FotoKita \u2764\uFE0F',w/2,h-bB/2);
    const sl=ctx.createLinearGradient(bS,0,bS*2.5,0);
    sl.addColorStop(0,'rgba(0,0,0,.08)'); sl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sl; ctx.fillRect(bS,bT,bS*1.5,h-bT-bB);
  }
},
{
  name:'Gold Luxe',
  draw(ctx,w,h){
    const g=ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#fbbf24'); g.addColorStop(.3,'#f59e0b'); g.addColorStop(.7,'#fbbf24'); g.addColorStop(1,'#d97706');
    ctx.strokeStyle=g; ctx.lineWidth=4; ctx.strokeRect(5,5,w-10,h-10);
    ctx.strokeStyle='rgba(251,191,36,.3)'; ctx.lineWidth=1; ctx.strokeRect(14,14,w-28,h-28);
    const cs=Math.min(w,h)*.038;
    ctx.fillStyle='#fbbf24'; ctx.shadowColor='rgba(251,191,36,.5)'; ctx.shadowBlur=8;
    [[5,5],[w-5,5],[5,h-5],[w-5,h-5]].forEach(([cx,cy])=>{
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.PI/4); ctx.fillRect(-cs,-cs,cs*2,cs*2); ctx.restore();
    });
    ctx.shadowBlur=0;
    const csz=Math.min(w,h)*.07; ctx.font=csz+'px serif';
    ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText('\uD83D\uDC51',w/2,csz*.08);
    ctx.fillStyle='rgba(251,191,36,.55)'; ctx.font=(Math.min(w,h)*.033)+'px Outfit,sans-serif';
    ctx.textBaseline='bottom'; ctx.fillText('\u2736  GOLD LUXE  \u2736',w/2,h-csz*.15);
  }
}
];

// ── Thumbnails ───────────────────────────────────────────
function renderThumbs(){
  fg.innerHTML='';
  FRAMES.forEach((f,i)=>{
    const wrap=document.createElement('div');
    wrap.className='frame-thumb'+(i===0?' active':'');
    const c=document.createElement('canvas'); c.width=120; c.height=90;
    const ctx=c.getContext('2d'); ctx.fillStyle='#1e1e2e'; ctx.fillRect(0,0,120,90);
    f.draw(ctx,120,90);
    const lbl=document.createElement('div'); lbl.className='ftlabel'; lbl.textContent=f.name;
    wrap.appendChild(c); wrap.appendChild(lbl);
    wrap.addEventListener('click',()=>{
      document.querySelector('.frame-thumb.active')?.classList.remove('active');
      wrap.classList.add('active'); selFrame=i;
    });
    fg.appendChild(wrap);
  });
}

// ── Strip row ────────────────────────────────────────────
function renderStrip(){
  sr.innerHTML='';
  for(let i=0;i<MAX;i++){
    const slot=document.createElement('div');
    slot.className='strip-slot'; slot.id='sl'+i;
    const n=document.createElement('div'); n.className='snum'; n.textContent='#'+(i+1);
    const e=document.createElement('span'); e.textContent='\u2014';
    slot.appendChild(n); slot.appendChild(e); sr.appendChild(slot);
  }
}
function fillSlot(i,url){
  const s=document.getElementById('sl'+i); if(!s)return;
  s.innerHTML=''; s.classList.add('taken');
  const n=document.createElement('div'); n.className='snum'; n.textContent='#'+(i+1);
  const img=document.createElement('img'); img.src=url;
  const del=document.createElement('button'); del.className='sdel'; del.textContent='\xD7';
  del.title='Hapus'; del.onclick=e=>{
    e.stopPropagation(); photos.splice(i,1);
    renderStrip(); photos.forEach((p,j)=>fillSlot(j,p)); updateUI();
  };
  s.appendChild(n); s.appendChild(img); s.appendChild(del);
}

// ── Dots & UI ────────────────────────────────────────────
function updateDots(act=-1){
  dots.forEach((d,i)=>{
    d.classList.remove('taken','active');
    if(i<photos.length)d.classList.add('taken');
    else if(i===act)d.classList.add('active');
  });
}
function updateUI(){
  const full=photos.length>=MAX, some=photos.length>0;
  capBtn.disabled=full||shooting||!ready;
  resetBtn.disabled=!some||shooting;
  dlBtn.disabled=!some||shooting;
  done.classList.toggle('visible',full&&!shooting);
  capBtn.innerHTML=photos.length===0?'&#128247; Mulai Strip 4 Foto':
    photos.length<MAX?'&#128247; Lanjutkan ('+(MAX-photos.length)+' tersisa)':
    '&#10003; Strip Selesai!';
  updateDots();
}

// ── Camera ───────────────────────────────────────────────
async function startCam(){
  const tries=[
    {video:{width:{ideal:1280},height:{ideal:960},facingMode:'user'}},
    {video:{width:{ideal:640},height:{ideal:480}}},{video:true}
  ];
  let stream=null;
  for(const c of tries){try{stream=await navigator.mediaDevices.getUserMedia(c);break;}catch(e){}}
  if(!stream){ncEl.style.display='flex';return;}
  vid.srcObject=stream;
  vid.addEventListener('loadeddata',()=>{
    pc.width=vid.videoWidth||640; pc.height=vid.videoHeight||480;
    ready=true; updateUI(); loop();
  });
}
function loop(){
  if(vid.readyState>=2){
    const w=pc.width,h=pc.height;
    pctx.save(); pctx.translate(w,0); pctx.scale(-1,1);
    pctx.drawImage(vid,0,0,w,h); pctx.restore();
    FRAMES[selFrame].draw(pctx,w,h);
  }
  requestAnimationFrame(loop);
}

// ── Capture ──────────────────────────────────────────────
function countdown(n){
  return new Promise(res=>{
    co.classList.add('visible'); let cur=n;
    function tick(){
      cn.classList.remove('pop'); void cn.offsetWidth;
      if(cur>0){cn.textContent=cur--;cn.classList.add('pop');setTimeout(tick,1000);}
      else{co.classList.remove('visible');res();}
    }
    tick();
  });
}
function flash(){fl.classList.remove('flash');void fl.offsetWidth;fl.classList.add('flash');}
function capture(){
  const vw=vid.videoWidth||pc.width,vh=vid.videoHeight||pc.height;
  const cap=document.createElement('canvas'); cap.width=vw; cap.height=vh;
  const ctx=cap.getContext('2d');
  ctx.save(); ctx.translate(vw,0); ctx.scale(-1,1); ctx.drawImage(vid,0,0,vw,vh); ctx.restore();
  FRAMES[selFrame].draw(ctx,vw,vh);
  return cap.toDataURL('image/jpeg',.93);
}
async function shoot(){
  if(shooting||photos.length>=MAX)return;
  shooting=true; done.classList.remove('visible'); updateUI();
  const start=photos.length, need=MAX-start;
  for(let i=0;i<need;i++){
    const idx=start+i; updateDots(idx);
    await countdown(3); flash();
    await new Promise(r=>setTimeout(r,120));
    const url=capture(); photos.push(url); fillSlot(idx,url); updateDots();
    if(i<need-1)await new Promise(r=>setTimeout(r,700));
  }
  shooting=false; updateUI();
}
function reset(){photos=[];renderStrip();updateUI();}

// ── Download ─────────────────────────────────────────────
function download(){
  if(!photos.length)return;
  const vw=vid.videoWidth||640,vh=vid.videoHeight||480,asp=vh/vw;
  const pW=480,pH=Math.round(pW*asp),gap=10,pad=26,footer=56,cnt=photos.length;
  const sw=pW+pad*2,sh=cnt*pH+(cnt-1)*gap+pad*2+footer;
  const strip=document.createElement('canvas'); strip.width=sw; strip.height=sh;
  const ctx=strip.getContext('2d');
  ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,sw,sh);
  ctx.strokeStyle='rgba(244,63,94,.35)'; ctx.lineWidth=2; ctx.strokeRect(1,1,sw-2,sh-2);
  let loaded=0;
  photos.forEach((url,i)=>{
    const img=new Image();
    img.onload=()=>{
      ctx.drawImage(img,pad,pad+i*(pH+gap),pW,pH); loaded++;
      if(loaded===photos.length){
        ctx.fillStyle='rgba(255,255,255,.04)'; ctx.fillRect(0,sh-footer,sw,footer);
        ctx.fillStyle='rgba(255,255,255,.06)'; ctx.fillRect(0,sh-footer,sw,1);
        ctx.font='italic bold '+(footer*.42)+'px Dancing Script,Georgia,serif';
        ctx.fillStyle='#fb7185'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('FotoKita \u2764\uFE0F',sw/2,sh-footer/2-4);
        const d=new Date();
        ctx.font=(footer*.22)+'px Outfit,sans-serif'; ctx.fillStyle='rgba(255,255,255,.28)';
        ctx.textBaseline='bottom';
        ctx.fillText(d.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}),sw/2,sh-7);
        const a=document.createElement('a'); a.download='fotokita-'+Date.now()+'.jpg';
        a.href=strip.toDataURL('image/jpeg',.92); a.click();
      }
    };
    img.src=url;
  });
}

capBtn.addEventListener('click',shoot);
resetBtn.addEventListener('click',reset);
dlBtn.addEventListener('click',download);

renderThumbs(); renderStrip(); startCam();
</script>
</body>
